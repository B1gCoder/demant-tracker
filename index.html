<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <h2>Production Tracker</h2>

    <div class="card" style="border-color: #58a6ff; background-color: rgba(88, 166, 255, 0.05);">
        <h3 style="margin-top: 0; color: #58a6ff;">Miesięczne Cele (Max 2)</h3>
        
        <div id="goals-list" style="margin-bottom: 15px;">
            </div>

        <div id="add-goal-container">
            <form id="add-goal-form" style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
                <div style="flex-grow: 1; min-width: 150px;">
                    <label style="color: #c9d1d9;">Wybierz zadanie</label>
                    <select id="goal-process-select" required style="border-color: #58a6ff;"></select>
                </div>
                <div style="width: 100px;">
                    <label style="color: #c9d1d9;">Cel (szt/h)</label>
                    <input type="number" id="goal-norm-input" required style="border-color: #58a6ff;">
                </div>
                <button type="submit" style="width: auto; background-color: #58a6ff; color: #000;">Ustaw Cel</button>
            </form>
        </div>
    </div>

    <div class="card">
        <form id="tracker-form">
            <div class="form-group">
                <label for="date-input">Data zmiany</label>
                <input type="date" id="date-input" required>
            </div>
            <div class="form-group">
                <label for="process-select">Proces / Przeróbka</label>
                <select id="process-select" required>
                    <option value="">Wczytywanie zadań...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="hours-input">Czas pracy (godziny)</label>
                <input type="number" id="hours-input" step="0.01" placeholder="np. 0.25 lub 1.5" required>
            </div>
            <div class="form-group">
                <label for="pieces-input">Wykonane sztuki</label>
                <input type="number" id="pieces-input" placeholder="np. 550" required>
            </div>
            <button type="submit">Zapisz wynik</button>
        </form>
    </div>

    <div id="logs-wrapper">
        </div>

    <h3 style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">Słownik Zadań</h3>
    <div class="card" style="border-color: var(--accent-orange); margin-bottom: 15px;">
        <form id="new-task-form">
            <div class="form-group">
                <label for="task-name">Nazwa zadania</label>
                <input type="text" id="task-name" placeholder="np. Montaż ucha" required>
            </div>
            <div class="form-group">
                <label for="task-type">Typ zadania</label>
                <select id="task-type" required>
                    <option value="Proces">Proces</option>
                    <option value="Przeróbka">Przeróbka</option>
                </select>
            </div>
            <div class="form-group">
                <label for="task-norm">Domyślna norma na godzinę</label>
                <input type="number" id="task-norm" placeholder="np. 600" required>
            </div>
            <button type="submit" style="background-color: var(--accent-orange); color: #000;">Dodaj zadanie do bazy</button>
        </form>
    </div>
    <div class="card" id="tasks-manage-list" style="padding: 0; max-height: 250px; overflow-y: auto;">
        </div>
</div>

<script>
    const SUPABASE_URL = "https://ekckurobugcufslazrqa.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrY2t1cm9idWdjdWZzbGF6cnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzYxNDksImV4cCI6MjA5NDYxMjE0OX0.hyxbmSl5snpnHf0QDCdsKhi8ARfOgFBHpbYsENh93-4";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

    // Globalna tablica z zadaniami, żeby główny formularz miał do nich szybki dostęp
    let allProcesses = [];

    async function fetchProcesses() {
        const { data, error } = await db.from('processes').select('*').order('name');
        if (error) return console.error(error);
        
        allProcesses = data;
        const procesy = data.filter(p => p.type === 'Proces' || !p.type);
        const przerobki = data.filter(p => p.type === 'Przeróbka');

        // 1. Ładowanie głównego formularza wyników
        let selectHtml = '<option value="">Wybierz zadanie...</option>';
        if (procesy.length > 0) {
            selectHtml += '<optgroup label="Procesy">';
            procesy.forEach(p => {
                const normText = p.goal_norm ? `CEL: ${p.goal_norm}/h` : `Norma: ${p.norm_per_hour}/h`;
                selectHtml += `<option value="${p.id}">${p.name} (${normText})</option>`;
            });
            selectHtml += '</optgroup>';
        }
        if (przerobki.length > 0) {
            selectHtml += '<optgroup label="Przeróbki">';
            przerobki.forEach(p => {
                const normText = p.goal_norm ? `CEL: ${p.goal_norm}/h` : `Norma: ${p.norm_per_hour}/h`;
                selectHtml += `<option value="${p.id}">${p.name} (${normText})</option>`;
            });
            selectHtml += '</optgroup>';
        }
        document.getElementById('process-select').innerHTML = selectHtml;

        // 2. Ładowanie słownika zarządzania
        const manageList = document.getElementById('tasks-manage-list');
        manageList.innerHTML = data.map(p => `
            <div class="log-item" style="padding: 10px 15px;">
                <div style="flex-grow: 1;">
                    <strong style="color: #f0f6fc;">${p.name}</strong> 
                    <span style="font-size: 10px; color: var(--accent-orange); text-transform: uppercase;">[${p.type || 'Proces'}]</span>
                    <br><small style="color: #8b949e;">Norma bazowa: ${p.norm_per_hour}/h</small>
                </div>
                <button class="delete-btn" onclick="deleteProcess(${p.id}, '${p.name}')" style="padding: 4px 8px; font-size: 11px;">Usuń</button>
            </div>
        `).join('');

        // 3. Ładowanie miesięcznych celów
        const activeGoals = data.filter(p => p.goal_norm !== null);
        const goalsList = document.getElementById('goals-list');
        
        if (activeGoals.length === 0) {
            goalsList.innerHTML = '<small style="color: #8b949e;">Brak ustawionych celów na ten miesiąc.</small>';
        } else {
            goalsList.innerHTML = activeGoals.map(g => `
                <div class="log-item" style="padding: 8px 10px; border: 1px solid #58a6ff; border-radius: 6px; margin-bottom: 5px; background-color: #0d1117;">
                    <div>
                        <strong style="color: #f0f6fc;">${g.name}</strong><br>
                        <small>Nowy cel: <strong style="color: #58a6ff;">${g.goal_norm} szt/h</strong> <span style="color: #8b949e;">(zamiast ${g.norm_per_hour})</span></small>
                    </div>
                    <button class="delete-btn" onclick="removeGoal(${g.id})" style="color: #58a6ff; border-color: #58a6ff;">Usuń cel</button>
                </div>
            `).join('');
        }

        // Ukrywanie formularza dodawania celu, jeśli są już 2
        document.getElementById('add-goal-container').style.display = activeGoals.length >= 2 ? 'none' : 'block';
        
        // Formularz wyboru zadania dla celu (tylko te, które nie mają celu)
        const goalSelect = document.getElementById('goal-process-select');
        goalSelect.innerHTML = '<option value="">Wybierz...</option>' + 
            data.filter(p => p.goal_norm === null).map(p => `<option value="${p.id}">${p.name} (${p.type})</option>`).join('');
    }

    // Dodawanie celu
    document.getElementById('add-goal-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const processId = document.getElementById('goal-process-select').value;
        const goalNorm = document.getElementById('goal-norm-input').value;

        const { error } = await db.from('processes').update({ goal_norm: parseInt(goalNorm) }).eq('id', processId);
        if(!error) {
            document.getElementById('goal-norm-input').value = '';
            fetchProcesses();
        }
    });

    // Usuwanie celu (przywracanie do domyślnej normy)
    window.removeGoal = async function(id) {
        const { error } = await db.from('processes').update({ goal_norm: null }).eq('id', id);
        if(!error) fetchProcesses();
    };

    window.deleteProcess = async function(id, name) {
        if (confirm(`Czy usunąć zadanie "${name}" ze słownika?`)) {
            const { error } = await db.from('processes').delete().eq('id', id);
            if (error && error.code === "23503") {
                alert(`Nie możesz usunąć zadania "${name}", ponieważ jest w historii wpisów.`);
            } else {
                fetchProcesses();
            }
        }
    };

    async function fetchDailyLogs() {
        // Zwróć uwagę na pobieranie 'applied_norm'
        const { data, error } = await db
            .from('daily_logs')
            .select(`id, log_date, hours_spent, pieces_made, applied_norm, processes(name, norm_per_hour, type)`)
            .order('log_date', { ascending: false })
            .order('id', { ascending: false });

        if (error) return console.error(error);

        const wrapper = document.getElementById('logs-wrapper');
        if (data.length === 0) {
            wrapper.innerHTML = '<p style="text-align: center; color: #8b949e; padding: 20px;">Brak wpisów w bazie.</p>';
            return;
        }

        const groupedLogs = data.reduce((acc, log) => {
            const date = log.log_date;
            if (!acc[date]) acc[date] = [];
            acc[date].push(log);
            return acc;
        }, {});

        let html = '';
        for (const [date, logs] of Object.entries(groupedLogs)) {
            const dateObj = new Date(date);
            const formattedDate = dateObj.toLocaleDateString('pl-PL');

            html += `<h3>Zapisy z dnia: ${formattedDate}</h3>`;
            html += `<div class="card" style="padding: 0;">`;
            
            logs.forEach(log => {
                const processData = log.processes || { name: 'Usunięte zadanie', norm_per_hour: 1, type: 'Brak' };
                
                // Kluczowa logika: używamy zamrożonej normy (applied_norm), jeśli brakuje, bierzemy domyślną
                const activeNorm = log.applied_norm ? log.applied_norm : processData.norm_per_hour;
                const expected = log.hours_spent * activeNorm;
                const efficiency = Math.round((log.pieces_made / expected) * 100);
                const taskType = processData.type || 'Proces';

                // Wizualna informacja, czy do wyliczenia posłużył cel, czy standardowa norma
                const isGoal = log.applied_norm && log.applied_norm !== processData.norm_per_hour;
                const normInfoHtml = isGoal 
                    ? `<span style="color: #58a6ff;">Wymagane z Celu: ${activeNorm}/h</span>` 
                    : `Norma: ${activeNorm}/h`;

                let statusClass = 'good';
                if (efficiency < 100) statusClass = 'warn';
                if (efficiency < 90) statusClass = 'bad';

                html += `
                    <div class="log-item">
                        <div style="flex-grow: 1;">
                            <strong style="color: #f0f6fc;">${processData.name} <span style="font-size: 10px; color: var(--accent-orange); text-transform: uppercase;">[${taskType}]</span></strong><br>
                            <small style="color: #8b949e;">${log.hours_spent}h | ${log.pieces_made} szt. | ${normInfoHtml}</small>
                        </div>
                        <div class="efficiency-badge ${statusClass}">${efficiency}%</div>
                        <button class="delete-btn" onclick="deleteLog(${log.id})">X</button>
                    </div>
                `;
            });
            html += `</div>`;
        }

        wrapper.innerHTML = html;
    }

    window.deleteLog = async function(id) {
        if(confirm("Czy na pewno chcesz usunąć ten wpis z historii zmian?")) {
            const { error } = await db.from('daily_logs').delete().eq('id', id);
            if (!error) fetchDailyLogs();
        }
    };

    // ZAPISYWANIE WYNIKU - Z uwzględnieniem aktywnego celu
    document.getElementById('tracker-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const dateVal = document.getElementById('date-input').value;
        const processId = document.getElementById('process-select').value;
        const hours = document.getElementById('hours-input').value;
        const pieces = document.getElementById('pieces-input').value;

        // Znajdź wybrane zadanie w tablicy wszystkich zadań
        const selectedProcess = allProcesses.find(p => p.id === parseInt(processId));
        
        // Zdefiniuj, jaka norma ma zostać zapamiętana dla tego wpisu
        const normToApply = selectedProcess.goal_norm !== null ? selectedProcess.goal_norm : selectedProcess.norm_per_hour;

        const { error } = await db.from('daily_logs').insert([
            { 
                log_date: dateVal, 
                process_id: parseInt(processId), 
                hours_spent: parseFloat(hours), 
                pieces_made: parseInt(pieces),
                applied_norm: normToApply // Zapisujemy użytą normę!
            }
        ]);

        if (error) {
            alert('Błąd podczas zapisywania danych');
            console.error(error);
        } else {
            document.getElementById('hours-input').value = '';
            document.getElementById('pieces-input').value = '';
            fetchDailyLogs();
        }
    });
// BRAKUJĄCA FUNKCJA - Dodawanie zadania do bazy
    document.getElementById('new-task-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // To blokuje odświeżanie strony!
        
        const nameVal = document.getElementById('task-name').value;
        const typeVal = document.getElementById('task-type').value;
        const normVal = document.getElementById('task-norm').value;

        const { error } = await db.from('processes').insert([
            { 
                name: nameVal, 
                type: typeVal, 
                norm_per_hour: parseInt(normVal) 
            }
        ]);

        if (error) {
            alert('Błąd podczas dodawania zadania do bazy.');
            console.error(error);
        } else {
            document.getElementById('task-name').value = '';
            document.getElementById('task-norm').value = '';
            fetchProcesses(); // Odświeża listy po dodaniu
        }
    });

    fetchProcesses();
    fetchDailyLogs();
</script>
</body>
</html>
