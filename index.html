<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <h2>Production Tracker</h2>

    <div class="card">
        <form id="tracker-form">
            <div class="form-group">
                <label for="date-input">Data zmiany</label>
                <input type="date" id="date-input" required>
            </div>
            <div class="form-group">
                <label for="process-select">Proces / Przeróbka</label>
                <select id="process-select" required>
                    <option value="">Wczytywanie zadań...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="hours-input">Czas pracy (godziny)</label>
                <input type="number" id="hours-input" step="0.01" placeholder="np. 0.25 lub 1.5" required>
            </div>
            <div class="form-group">
                <label for="pieces-input">Wykonane sztuki</label>
                <input type="number" id="pieces-input" placeholder="np. 550" required>
            </div>
            <button type="submit">Zapisz wynik</button>
        </form>
    </div>

    <div id="logs-wrapper">
        </div>

    <h3 style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">Zarządzanie Zadaniami</h3>
    
    <div class="card" style="border-color: var(--accent-orange); margin-bottom: 15px;">
        <form id="new-task-form">
            <div class="form-group">
                <label for="task-name">Nazwa zadania</label>
                <input type="text" id="task-name" placeholder="np. Montaż ucha" required>
            </div>
            <div class="form-group">
                <label for="task-type">Typ zadania</label>
                <select id="task-type" required>
                    <option value="Proces">Proces</option>
                    <option value="Przeróbka">Przeróbka</option>
                </select>
            </div>
            <div class="form-group">
                <label for="task-norm">Norma na godzinę (szt.)</label>
                <input type="number" id="task-norm" placeholder="np. 500" required>
            </div>
            <button type="submit" style="background-color: var(--accent-orange); color: #000;">Dodaj nowe zadanie do bazy</button>
        </form>
    </div>

    <h4 style="color: #8b949e; margin-bottom: 10px;">Aktualna lista zadań w słowniku:</h4>
    <div class="card" id="tasks-manage-list" style="padding: 0; max-height: 250px; overflow-y: auto;">
        </div>
</div>

<script>
    const SUPABASE_URL = "https://ekckurobugcufslazrqa.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrY2t1cm9idWdjdWZzbGF6cnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzYxNDksImV4cCI6MjA5NDYxMjE0OX0.hyxbmSl5snpnHf0QDCdsKhi8ARfOgFBHpbYsENh93-4";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

    // Pobieranie zadań i jednoczesne odświeżanie dropdowna oraz listy zarządzania
    async function fetchProcesses() {
        const { data, error } = await db.from('processes').select('*').order('name');
        if (error) return console.error(error);
        
        // 1. Aktualizacja głównego dropdowna do zapisywania wyników
        const procesy = data.filter(p => p.type === 'Proces' || !p.type);
        const przerobki = data.filter(p => p.type === 'Przeróbka');

        let selectHtml = '<option value="">Wybierz zadanie...</option>';
        
        if (procesy.length > 0) {
            selectHtml += '<optgroup label="Procesy">';
            procesy.forEach(p => selectHtml += `<option value="${p.id}">${p.name} (Norma: ${p.norm_per_hour}/h)</option>`);
            selectHtml += '</optgroup>';
        }

        if (przerobki.length > 0) {
            selectHtml += '<optgroup label="Przeróbki">';
            przerobki.forEach(p => selectHtml += `<option value="${p.id}">${p.name} (Norma: ${p.norm_per_hour}/h)</option>`);
            selectHtml += '</optgroup>';
        }

        document.getElementById('process-select').innerHTML = selectHtml;

        // 2. Aktualizacja listy pod formularzem (słownika zadań z opcją usuwania)
        const manageList = document.getElementById('tasks-manage-list');
        if (data.length === 0) {
            manageList.innerHTML = '<p style="color: #8b949e; padding: 15px; text-align: center;">Brak zdefiniowanych zadań.</p>';
            return;
        }

        manageList.innerHTML = data.map(p => `
            <div class="log-item" style="padding: 10px 15px;">
                <div style="flex-grow: 1;">
                    <strong style="color: #f0f6fc;">${p.name}</strong> 
                    <span style="font-size: 10px; color: var(--accent-orange); text-transform: uppercase;">[${p.type || 'Proces'}]</span>
                    <br><small style="color: #8b949e;">Norma: ${p.norm_per_hour}/h</small>
                </div>
                <button class="delete-btn" onclick="deleteProcess(${p.id}, '${p.name}')" style="padding: 4px 8px; font-size: 11px;">Usuń</button>
            </div>
        `).join('');
    }

    // Funkcja usuwania samego zadania ze słownika (z obsługą klucza obcego)
    window.deleteProcess = async function(id, name) {
        if (confirm(`Czy na pewno chcesz bezpowrotnie usunąć zadanie "${name}" ze słownika bazowego?`)) {
            const { error } = await db.from('processes').delete().eq('id', id);
            
            if (error) {
                // Kod błędu 23503 w PostgreSQL oznacza naruszenie więzów integralności (klucz obcy jest używany)
                if (error.code === "23503") {
                    alert(`Nie możesz usunąć zadania "${name}", ponieważ masz już zapisane codzienne wyniki z nim powiązane. Najpierw usuń wpisy z historii zmian.`);
                } else {
                    alert("Błąd podczas usuwania zadania.");
                    console.error(error);
                }
            } else {
                fetchProcesses(); // Odśwież widoki
            }
        }
    };

    // Pobieranie i wyświetlanie zalogowanych wyników dnia
    async function fetchDailyLogs() {
        const { data, error } = await db
            .from('daily_logs')
            .select(`id, log_date, hours_spent, pieces_made, processes(name, norm_per_hour, type)`)
            .order('log_date', { ascending: false })
            .order('id', { ascending: false });

        if (error) return console.error(error);

        const wrapper = document.getElementById('logs-wrapper');
        if (data.length === 0) {
            wrapper.innerHTML = '<p style="text-align: center; color: #8b949e; padding: 20px;">Brak wpisów w bazie.</p>';
            return;
        }

        const groupedLogs = data.reduce((acc, log) => {
            const date = log.log_date;
            if (!acc[date]) acc[date] = [];
            acc[date].push(log);
            return acc;
        }, {});

        let html = '';
        for (const [date, logs] of Object.entries(groupedLogs)) {
            const dateObj = new Date(date);
            const formattedDate = dateObj.toLocaleDateString('pl-PL');

            html += `<h3>Zapisy z dnia: ${formattedDate}</h3>`;
            html += `<div class="card" style="padding: 0;">`;
            
            logs.forEach(log => {
                // Zabezpieczenie na wypadek braku powiązanego procesu (fallback)
                const processData = log.processes || { name: 'Usunięte zadanie', norm_per_hour: 1, type: 'Brak' };
                const norm = processData.norm_per_hour;
                const expected = log.hours_spent * norm;
                const efficiency = Math.round((log.pieces_made / expected) * 100);
                const taskType = processData.type || 'Proces';

                let statusClass = 'good';
                if (efficiency < 100) statusClass = 'warn';
                if (efficiency < 90) statusClass = 'bad';

                html += `
                    <div class="log-item">
                        <div style="flex-grow: 1;">
                            <strong style="color: #f0f6fc;">${processData.name} <span style="font-size: 10px; color: var(--accent-orange); text-transform: uppercase;">[${taskType}]</span></strong><br>
                            <small style="color: #8b949e;">${log.hours_spent}h | ${log.pieces_made} szt.</small>
                        </div>
                        <div class="efficiency-badge ${statusClass}">${efficiency}%</div>
                        <button class="delete-btn" onclick="deleteLog(${log.id})">X</button>
                    </div>
                `;
            });
            html += `</div>`;
        }

        wrapper.innerHTML = html;
    }

    // Usuwanie wpisu dziennego
    window.deleteLog = async function(id) {
        if(confirm("Czy na pewno chcesz usunąć ten wpis z historii zmian?")) {
            const { error } = await db.from('daily_logs').delete().eq('id', id);
            if (error) {
                alert("Błąd podczas usuwania wpisu.");
                console.error(error);
            } else {
                fetchDailyLogs();
            }
        }
    };

    // Obsługa dodawania wyniku
    document.getElementById('tracker-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const dateVal = document.getElementById('date-input').value;
        const processId = document.getElementById('process-select').value;
        const hours = document.getElementById('hours-input').value;
        const pieces = document.getElementById('pieces-input').value;

        const { error } = await db.from('daily_logs').insert([
            { 
                log_date: dateVal, 
                process_id: parseInt(processId), 
                hours_spent: parseFloat(hours), 
                pieces_made: parseInt(pieces) 
            }
        ]);

        if (error) {
            alert('Błąd podczas zapisywania danych');
            console.error(error);
        } else {
            document.getElementById('hours-input').value = '';
            document.getElementById('pieces-input').value = '';
            fetchDailyLogs();
        }
    });

    // Obsługa dodawania nowego typu zadania
    document.getElementById('new-task-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nameVal = document.getElementById('task-name').value;
        const typeVal = document.getElementById('task-type').value;
        const normVal = document.getElementById('task-norm').value;

        const { error } = await db.from('processes').insert([
            { 
                name: nameVal, 
                type: typeVal, 
                norm_per_hour: parseInt(normVal) 
            }
        ]);

        if (error) {
            alert('Błąd podczas dodawania zadania do bazy.');
            console.error(error);
        } else {
            document.getElementById('task-name').value = '';
            document.getElementById('task-norm').value = '';
            fetchProcesses();
        }
    });

    // Start aplikacji
    fetchProcesses();
    fetchDailyLogs();
</script>
</body>
</html>
